[package]
name = "wprcontrol"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for the Windows Performance Recorder (WPR) Control API"
license = "MIT"

[dependencies.windows-core]
git = "https://github.com/JustRustThings/windows-rs"
branch = "stuff-0.62.2"

[dependencies.windows-link]
git = "https://github.com/JustRustThings/windows-rs"
branch = "stuff-0.62.2"

[dependencies.windows]
git = "https://github.com/JustRustThings/windows-rs"
branch = "stuff-0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
]

[build-dependencies.windows-bindgen]
git = "https://github.com/JustRustThings/windows-rs"
branch = "stuff-0.62.2"
